parameters:
  - name: workingDirectory
    type: string
  - name: terraformCommand
    type: string

steps:
  - task: AzureCLI@2
    displayName: 'Execute Terraform'
    inputs:
      azureSubscription: 'azure-service-connection' # Ensure this matches your service connection
      addSpnToEnvironment: true
      scriptType: 'bash'
      scriptLocation: 'inlineScript' # <-- Add this exact line
      workingDirectory: ${{ parameters.workingDirectory }}
      inlineScript: |
        set -e
        # Map Azure ADO Service Connection credentials to Terraform ARM variables
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_OIDC_TOKEN=$idToken
        export ARM_USE_OIDC=true
        export ARM_TENANT_ID=$tenantId
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

        # Execute the commands passed into the template
        ${{ parameters.terraformCommand }}
