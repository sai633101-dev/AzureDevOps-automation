trigger: none

pool:
  vmImage: 'ubuntu-latest'

# Link BOTH library groups
variables:
  - group: avd-foundation-vars
  - group: avd-vm-vars

stages:
  - stage: Plan
    jobs:
      - job: TerraformPlan
        steps:
          - template: templates/terraform-install.yml
          - template: templates/azure-auth.yml
            parameters:
              workingDirectory: 'terraform/session_hosts'
              terraformCommand: |
                # 1. Export standard Terraform variables from the library
                export TF_VAR_rg_name="$(rg_name)"
                export TF_VAR_vnet_name="$(vnet_name)"
                export TF_VAR_subnet_name="$(subnet_name)"
                export TF_VAR_keyvault_name="$(keyvault_name)"
                export TF_VAR_hostpool_name="$(hostpool_name)"
                export TF_VAR_vm_prefix="$(vm_prefix)"
                export TF_VAR_vm_size="$(vm_size)"
                export TF_VAR_admin_username="$(admin_username)"
                export TF_VAR_admin_password="$(admin_password)"

                # 2. Query Azure to see exactly how many Session Hosts currently exist in the host pool
                CURRENT_COUNT=$(az desktopvirtualization sessionhost list \
                  --resource-group "$(rg_name)" \
                  --host-pool-name "$(hostpool_name)" \
                  --query "length([])" -o tsv 2>/dev/null || echo "0")
                
                # Ensure the variables resolve as valid integers for the math operation
                CURRENT_COUNT=${CURRENT_COUNT:-0}
                VMS_TO_ADD="$(vms_to_add)"
                VMS_TO_ADD=${VMS_TO_ADD:-0}
                
                # 3. Add the library value to the current Azure environment count
                TOTAL_VM_COUNT=$((CURRENT_COUNT + VMS_TO_ADD))
                
                # 4. Export the final calculated total to the Terraform module
                export TF_VAR_total_vm_count=$TOTAL_VM_COUNT
                
                echo "========================================"
                echo "Current VMs in Azure: $CURRENT_COUNT"
                echo "VMs to add (from Library): $VMS_TO_ADD"
                echo "New Target Total for Terraform: $TOTAL_VM_COUNT"
                echo "========================================"

                terraform init
                terraform plan -out=tfplan
          
          - publish: '$(System.DefaultWorkingDirectory)/terraform/session_hosts/tfplan'
            artifact: session_hosts_plan

  - stage: Apply
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        environment: 'AVD-Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self # <-- Add this line
                - download: current
                  artifact: session_hosts_plan
                - template: templates/terraform-install.yml
                - script: cp $(Pipeline.Workspace)/session_hosts_plan/tfplan $(System.DefaultWorkingDirectory)/terraform/session_hosts/tfplan
                  displayName: 'Stage Plan File'
                - template: templates/azure-auth.yml
                  parameters:
                    workingDirectory: 'terraform/session_hosts'
                    terraformCommand: |
                      terraform init
                      terraform apply -auto-approve tfplan
