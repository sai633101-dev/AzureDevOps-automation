trigger: none

parameters:
  - name: VMs_To_Add
    type: number
    default: 1
    description: "How many new Session Hosts do you want to add?"

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: avd-test-vars 

stages:
  - stage: Plan
    jobs:
      - job: TerraformPlan
        steps:
          - template: templates/terraform-install.yml
          - template: templates/azure-auth.yml
            parameters:
              workingDirectory: 'terraform/session_hosts'
              terraformCommand: |
                # 1. Calculate the current number of VMs in the Host Pool
                CURRENT_COUNT=$(az desktopvirtualization sessionhost list \
                  --resource-group rg-avd-mtech-prod \
                  --host-pool-name hp-avd-mtech-01 \
                  --query "length([])" -o tsv 2>/dev/null || echo "0")
                
                # 2. Add the requested VMs to the current count
                TOTAL_VM_COUNT=$((CURRENT_COUNT + ${{ parameters.VMs_To_Add }}))
                
                echo "Current VMs: $CURRENT_COUNT"
                echo "Adding: ${{ parameters.VMs_To_Add }}"
                echo "Total Target VMs: $TOTAL_VM_COUNT"

                # 3. Pass the absolute total to Terraform
                terraform init
                terraform plan \
                  -var="total_vm_count=$TOTAL_VM_COUNT" \
                  -var="admin_password=$(admin_password)" \
                  -out=tfplan
          
          - publish: '$(System.DefaultWorkingDirectory)/terraform/session_hosts/tfplan'
            artifact: session_hosts_plan

  - stage: Apply
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        environment: 'AVD-Production' # Triggers the manual approval gate in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: session_hosts_plan
                
                - template: templates/terraform-install.yml
                
                - script: cp $(Pipeline.Workspace)/session_hosts_plan/tfplan $(System.DefaultWorkingDirectory)/terraform/session_hosts/tfplan
                  displayName: 'Stage Plan File'
                
                - template: templates/azure-auth.yml
                  parameters:
                    workingDirectory: 'terraform/session_hosts'
                    terraformCommand: |
                      terraform init
                      terraform apply -auto-approve tfplan
